name: E2E

# Manual for now: it boots wrangler dev, the embed and the playground, and drives
# Chromium. Once it has passed a few times here, move it onto pull_request.
on:
  workflow_dispatch:

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --filter @pocketkey/playground exec playwright install --with-deps chromium

      - name: Local secrets for wrangler dev
        working-directory: apps/api
        run: |
          printf 'BETTER_AUTH_SECRET=%s\nMOCK_KEY_SEED=%s\n' \
            "$(openssl rand -hex 32)" "$(openssl rand -hex 16)" > .dev.vars

      - run: pnpm e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/playground/playwright-report
            apps/playground/test-results
            apps/playground/.e2e/api.log
          retention-days: 7
