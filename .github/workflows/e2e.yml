name: E2E

# Boots wrangler dev, the embed and the playground, and drives Chromium. It
# needs no secret: the API runs on the in-memory key provider and prints its
# login codes to a log the test reads.
on:
  pull_request:
  workflow_dispatch:

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --filter @pockey/playground exec playwright install --with-deps chromium

      - name: Local secrets for wrangler dev
        working-directory: apps/api
        run: |
          printf 'BETTER_AUTH_SECRET=%s\n' "$(openssl rand -hex 32)" > .dev.vars

      - run: pnpm e2e

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/playground/playwright-report
            apps/playground/test-results
            apps/playground/.e2e/api.log
          retention-days: 7
